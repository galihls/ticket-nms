services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ticketing_nms
      POSTGRES_USER: ticketing
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticketing}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketing -d ticketing_nms"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?wajib diisi di .env}
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-False}
      DATABASE_URL: postgres://ticketing:${POSTGRES_PASSWORD:-ticketing}@db:5432/ticketing_nms
      ZABBIX_URL: ${ZABBIX_URL:-}
      ZABBIX_API_TOKEN: ${ZABBIX_API_TOKEN:-}
    volumes:
      - media:/app/media
      - static:/app/staticfiles
      - ./logs:/app/logs
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000
             --workers 3 --timeout 120 --access-logfile -"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - web
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/var/www/media:ro
      - static:/var/www/static:ro
    restart: unless-stopped

volumes:
  pgdata:
  media:
  static:
