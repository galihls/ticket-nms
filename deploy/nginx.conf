upstream ticketing_web {
    server web:8000;
}

# Rate limiting zone for authentication endpoints (5 requests per minute with burst of 5)
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

server {
    listen 80;
    server_name _;

    # Disable server version banner (prevents Information Disclosure)
    server_tokens off;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Lampiran tiket bisa berupa foto lapangan
    client_max_body_size 20M;

    access_log /var/log/nginx/ticketing.access.log;
    error_log  /var/log/nginx/ticketing.error.log;

    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /media/ {
        alias /var/www/media/;
        expires 7d;
        access_log off;
    }

    location /healthz/ {
        proxy_pass http://ticketing_web;
        access_log off;
    }

    # Rate-limited login endpoint against brute-force attacks
    location /akun/masuk/ {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://ticketing_web;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 180s;
    }

    location / {
        proxy_pass http://ticketing_web;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # Generate Excel bulanan bisa lama untuk data besar
        proxy_read_timeout 180s;
    }
}
