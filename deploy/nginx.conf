upstream ticketing_web {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # Lampiran tiket bisa berupa foto lapangan
    client_max_body_size 20M;

    access_log /var/log/nginx/ticketing.access.log;
    error_log  /var/log/nginx/ticketing.error.log;

    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /media/ {
        alias /var/www/media/;
        expires 7d;
        access_log off;
    }

    location /healthz/ {
        proxy_pass http://ticketing_web;
        access_log off;
    }

    location / {
        proxy_pass http://ticketing_web;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # Generate Excel bulanan bisa lama untuk data besar
        proxy_read_timeout 180s;
    }
}
